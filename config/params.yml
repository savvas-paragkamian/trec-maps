# Every path, source and tunable of trec-maps. Nothing is hard-coded in trecmaps/.
# Paths are relative to the repository root.

paths:
  sites_xlsx: data/TREC_site_data_export_all-sites.xlsx
  samples_xlsx: data/TREC_sample_data_export.xlsx            # soil / sediment samples (land transects)
  marine_xlsx: data/TREC_sample_data_athens_marine_metagenome.xlsx
  raw_dir: data/raw                                          # downloads (scripts/0*_get_*.py only)
  derived_dir: data/derived                                  # grids, profiles, render caches
  output_dir: output                                         # figures

sources:
  dem:
    # Copernicus DEM GLO-30 as cloud-optimised GeoTIFFs on the AWS open-data bucket.
    # {lat}/{lon} are the tile's south-west corner, e.g. N37 / E023 (1 x 1 degree tiles).
    url: "https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_{lat}_00_{lon}_00_DEM/Copernicus_DSM_COG_10_{lat}_00_{lon}_00_DEM.tif"
    citation: "Copernicus DEM GLO-30 (ESA; produced by Airbus/DLR), 30 m, heights above EGM2008"
  bathymetry:
    # EMODnet Bathymetry DTM through its WCS 1.0.0 service. `emodnet:mean` is the
    # latest DTM release (2024); the request is snapped to the native 1/16 arc-minute
    # grid so the server resamples nothing. Depths are negative metres below LAT.
    wcs: "https://ows.emodnet-bathymetry.eu/wcs"
    coverage: "emodnet:mean"
    native_deg: 0.00104166666667        # 1/960 degree = 1/16 arc minute (about 115 m)
    margin_cells: 4                     # extra native cells around the grid's bounding box
    citation: "EMODnet Bathymetry Consortium (2024). EMODnet Digital Bathymetry (DTM 2024). doi:10.12770/cf51df64-56f9-4a99-b1aa-36b8d7b743a1"
  landcover:
    # ESA WorldCover 2021 v200, 10 m, 3 x 3 degree cloud-optimised tiles on AWS; only the window
    # over the grid is read (GDAL range requests), as scripts/get_spatial.R does in trec-coastal-microbiome.
    url: "https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_{lat}{lon}_Map.tif"
    tile_deg: 3
    citation: "ESA WorldCover 2021 v200 (Zanaga et al. 2022, doi:10.5281/zenodo.7254221), 10 m, CC BY 4.0"
    classes:                            # code: [label, official legend colour]
      10: ["tree cover", "#006400"]
      20: ["shrubland", "#ffbb22"]
      30: ["grassland", "#ffff4c"]
      40: ["cropland", "#f096ff"]
      50: ["built-up", "#fa0000"]
      60: ["bare / sparse vegetation", "#b4b4b4"]
      70: ["snow and ice", "#f0f0f0"]
      80: ["permanent water bodies", "#0064c8"]
      90: ["herbaceous wetland", "#0096a0"]
      95: ["mangroves", "#00cf75"]
      100: ["moss and lichen", "#fae6a0"]
    soften: [0.72, 0.96]                # HSV saturation / value factors for the 2D figures (trec-coastal-microbiome)
    soften_3d: [0.55, 0.92]             # the path tracer adds its own light (crete3d used 0.52 / 0.92)
    water_color: "#a9c6d8"              # inland water bodies; the legend's dark blue reads as a shoreline step
    fallback_color: "#cfc6b4"           # land cells without a class

grid:
  crs: "EPSG:2100"                      # GGRS87 / Greek Grid (metres); EPSG:3035 for a pan-European run
  cell_m: 10
  dem_resampling: bilinear             # GLO-30 (30 m) -> grid
  bathy_resampling: cubic               # EMODnet (115 m) -> grid; nodata-aware, so land does not bleed in
  margin_m: {north: 2500, south: 1500, east: 1500, west: 1500}   # around the path's bounding box; a single number works too
  land_threshold_m: 0.5                 # DEM above this = land (GLO-30 has the sea at 0)
  sea_floor_cap_m: -0.5                 # sea cells never rise above this
  min_land_component_cells: 8           # drop DEM speckle at sea
  seam_cells: 6                         # ramp the sea floor from the cap to EMODnet over this many cells off the shoreline
  bathy_smooth_sigma_m: 40              # Gaussian on the sea floor (metres): the 115 m source cells would read as terraces
  land_smooth_sigma_cells: 0            # optional Gaussian on land (GLO-30 is a surface model: buildings, trees)

profile:
  step_m: 5                             # sampling step along the path
  land_extension_m: 50                  # the path continues this far beyond the inland-most sample
  sea_extension_m: 2000                 # without a Tara station the path continues this far offshore along the transect bearing
  break_at_m: 1500                      # broken x axis: metres up to here, kilometres beyond
  zones:                                # TREC sampling contexts, metres from the shoreline (negative = inland)
    - {name: "inland\n200-300 m", from: -300, to: -200}
    - {name: "transition\n50-150 m", from: -150, to: -50}
    - {name: "coastal\n10-50 m", from: -50, to: -10}
    - {name: "shoreline", from: -10, to: 10}
    - {name: "coastal waters", from: 10, to: 1000}
    - {name: "offshore (> 1 km)", from: 1000, to: null}
  figure: {width_in: 12.5, height_in: 5.0, dpi: 300}
  land_zoom: {enabled: true, from_m: -320, to_m: 120, box: [0.04, 0.40, 0.40, 0.46]}   # inset of the land transect, in axes fractions of the last panel
  colors:
    land: "#d8cdb0"
    ground_line: "#6b5e48"
    sea_floor: "#9fb7c2"
    water: "#cfe6ee"
    sea_level: "#2f6fa3"
    zone: "#8a5a2b"
    station: "#c8102e"
    sample: "#20262e"

schematic:                              # the TREC sampling-concept figure drawn with real data
  linthresh_m: 20                       # symmetric-log distance axis: linear within +-20 m of the shoreline
  linscale: 0.35
  ribbon_pt: 5                          # land cover ribbon along the surface, in points
  tube_pt: 11                           # sample tube markers, in points
  figure: {width_in: 12.5, height_in: 6.4, dpi: 300}
  zones:
    - {name: "Inland", from: null, to: -50, color: "#b9d59a"}
    - {name: "Coastal transition zone", from: -50, to: 1000, color: "#ead9a6"}
    - {name: "Offshore", from: 1000, to: null, color: "#a9c9e3"}
  colors:
    land: "#d8cdb0"
    ground_line: "#6b5e48"
    sea_floor: "#9fb7c2"
    water: "#cfe6ee"
    sea_level: "#2f6fa3"
    soil: "#6f9a3a"
    sediment: "#c98b3a"
    tube_edge: "#3b3b3b"
    water_sample: "#bfe0ee"
    water_sample_edge: "#2f6fa3"
    cast_line: "#2f6fa3"
    boat: "#20262e"
    text: "#20262e"

render:
  exaggeration: 3.0                     # vertical exaggeration on top of true metres (land)
  sea_exaggeration_factor: 2.0          # depths get exaggeration x this factor, so the sea floor reads as relief; stated in the legend
  block:
    pad_cells: 1                        # rim of cells at the base height around the grid: renders the cut walls
    base_depth_m: null                  # base of the block; null = 25 m below the deepest cell, rounded to 50 m
    cut_face_color: "#c9bfae"           # the walls
    waterline_color: "#2f6fa3"          # sea level drawn along the walls
    axis: {step_land_m: 100, step_sea_m: 50, color: "#20262e"}   # the vertical axis at the south-west corner
  water:                                # post-processed sea: depth attenuation plus a wavy, semi-transparent surface at sea level
    enabled: true
    color_stops: [[0, "#7fe0df"], [5, "#4cc6cd"], [15, "#2aa5bd"], [40, "#1d7aa8"], [90, "#15508c"], [160, "#0e3468"], [260, "#09244c"]]   # water body by depth: turquoise to deep blue
    depth_scale_m: 8                    # metres below sea level for 63% of max_alpha: shallow sandy bays read turquoise, not beige
    max_alpha: 0.85                     # leaves a little of the lit floor relief visible at depth
    surface:
      sky_color: "#c9dff0"              # what the surface reflects: a pale blue
      base_alpha: 0.15                  # veil of the surface itself, on top of the Fresnel term
      fresnel_f0: 0.02
      wave_shading: 1.4                 # gain on the wave tilt towards the sun (the visible ripples); keep low for a smooth sea
      crest: 1.8                        # shading above this gets white added (wave crests); out of reach = no foam
      crest_white: 0.0
      refraction_gain: 60               # pixels of floor displacement per unit wave slope, at 3840 wide
      waves: [[520, 0.030, 200], [300, 0.025, 215], [170, 0.018, 185], [90, 0.010, 240]]   # [wavelength m, slope, from-bearing]: long, gentle swells
      ripple: {scale_m: 160, slope: 0.012, smooth: 4}
      wave_scale: 1.0                   # wavelengths x this (the nearshore zoom uses 0.3)
      seed: 3
  tile_px: 960                          # the grid plus one tile must stay under forge3d's 512 MiB budget
  earth_model: flat                     # the plate is ~15 km wide: no Earth curvature
  refraction_model: none                # required together with earth_model: flat
  albedo_sampling: bilinear
  camera:                               # a low view from the sea: the block reads as a section, not a map
    azimuth_deg: auto                   # compass bearing the camera sits at: auto = the transect's seaward bearing, or a number
    azimuth_snap_deg: 90                # auto azimuths snap to a plate edge (0, 90, 180, 270), so the front wall is a cut face
    elevation_deg: 20
    fov_y_deg: 21
    fill: 0.84                          # fraction of the frame width the near plate edge spans (room for the axis and legend)
    fill_vertical: 0.55                 # the plate's depth plus the block's height fit this fraction of the frame height
    target_lift_m: 0
    target_shift_north_frac: -0.10      # look-at towards the camera: lifts the block in the frame, clear of the legend row
    target_shift_east_frac: 0.0
  sun: {azimuth_deg: auto, offset_from_camera_deg: -55, elevation_deg: 35, intensity: 12}   # auto = camera azimuth + offset (180 -> 125)
  env_intensity: 1.7
  turbidity: 1.4
  seed: 11
  quality:
    preview: {size: [1600, 900], frames: 6}
    draft: {size: [2560, 1440], frames: 16}
    final: {size: [3840, 2160], frames: 64}
  albedo:                               # sRGB stops [height_m, colour], interpolated per channel, then linearised
    land_mode: landcover                # landcover (ESA WorldCover classes) or hypsometric (the `land` ramp)
    land: [[0, "#dcd2b6"], [10, "#cfc49e"], [50, "#b9b78b"], [150, "#a3a67a"], [400, "#8f8a6a"]]
    sea: [[0, "#b08a62"], [-5, "#9a7452"], [-20, "#7d5c40"], [-60, "#64482f"], [-120, "#4e3724"], [-250, "#3a281a"]]   # sea floor: sand to dark brown, seen through the water
    shoreline: {color: "#f6efdc", width_cells: 1}
  page:
    background: "#f7f4ee"
    text: "#20262e"
    muted: "#5d6670"
    accent: "#8a5a2b"
    path: "#c8102e"
    station: "#c8102e"
    sample: "#20262e"
    vignette: 0.12
