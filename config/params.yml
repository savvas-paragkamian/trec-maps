# Every path, source and tunable of trec-maps. Nothing is hard-coded in trecmaps/.
# Paths are relative to the repository root.

paths:
  samples_xlsx: data/TREC_sample_data_export-all-MetaBGT.xlsx                  # soil / sediment samples of every LSI site
  marine_xlsx: data/TREC_site_data_export_all-sites_marine_matagenome.xlsx     # seawater samples: Tara stations and LSI shoreline water
  raw_dir: data/raw                                          # downloads (scripts/0*_get_*.py only)
  derived_dir: data/derived                                  # grids, profiles, render caches
  output_dir: output                                         # figures

sources:
  dem:
    # Copernicus DEM GLO-30 as cloud-optimised GeoTIFFs on the AWS open-data bucket.
    # {lat}/{lon} are the tile's south-west corner, e.g. N37 / E023 (1 x 1 degree tiles).
    url: "https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_{lat}_00_{lon}_00_DEM/Copernicus_DSM_COG_10_{lat}_00_{lon}_00_DEM.tif"
    citation: "Copernicus DEM GLO-30 (ESA; produced by Airbus/DLR), 30 m, heights above EGM2008"
  bathymetry:
    # EMODnet Bathymetry DTM through its WCS 1.0.0 service. `emodnet:mean` is the
    # latest DTM release (2024); the request is snapped to the native 1/16 arc-minute
    # grid so the server resamples nothing. Depths are negative metres below LAT.
    wcs: "https://ows.emodnet-bathymetry.eu/wcs"
    coverage: "emodnet:mean"
    native_deg: 0.00104166666667        # 1/960 degree = 1/16 arc minute (about 115 m)
    margin_cells: 4                     # extra native cells around the grid's bounding box
    citation: "EMODnet Bathymetry Consortium (2024). EMODnet Digital Bathymetry (DTM 2024). doi:10.12770/cf51df64-56f9-4a99-b1aa-36b8d7b743a1"
  landcover:
    # ESA WorldCover 2021 v200, 10 m, 3 x 3 degree cloud-optimised tiles on AWS; only the window
    # over the grid is read (GDAL range requests), as scripts/get_spatial.R does in trec-coastal-microbiome.
    url: "https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_{lat}{lon}_Map.tif"
    tile_deg: 3
    citation: "ESA WorldCover 2021 v200 (Zanaga et al. 2022, doi:10.5281/zenodo.7254221), 10 m, CC BY 4.0"
    classes:                            # code: [label, official legend colour]
      10: ["tree cover", "#006400"]
      20: ["shrubland", "#ffbb22"]
      30: ["grassland", "#ffff4c"]
      40: ["cropland", "#f096ff"]
      50: ["built-up", "#fa0000"]
      60: ["bare / sparse vegetation", "#b4b4b4"]
      70: ["snow and ice", "#f0f0f0"]
      80: ["permanent water bodies", "#0064c8"]
      90: ["herbaceous wetland", "#0096a0"]
      95: ["mangroves", "#00cf75"]
      100: ["moss and lichen", "#fae6a0"]
    soften: [0.72, 0.96]                # HSV saturation / value factors for the 2D figures (trec-coastal-microbiome)
    soften_3d: [0.55, 0.92]             # the path tracer adds its own light (crete3d used 0.52 / 0.92)
    water_color: "#a9c6d8"              # inland water bodies; the legend's dark blue reads as a shoreline step
    fallback_color: "#cfc6b4"           # land cells without a class

  coastal_zones:
    # Copernicus Coastal Zones 2018, land cover / land use in 71 classes (CODE_5_18) for a strip 10 km inland of the
    # coastline and the sea in front of it; the layer trec-coastal-microbiome reads at the sample positions. The
    # polygons that touch the grid box come from the EEA's public map service of the layer (no key), are cut to the
    # box and saved as GeoJSON (scripts/03_get_coastal_zones.py).
    service: "https://image.discomap.eea.europa.eu/arcgis/rest/services/CoastalZones/CZ_CoastalZones_2018/MapServer/0"
    field: CODE_5_18
    generalise_deg: 0.00002             # the service drops vertices closer than this to the outline (about 2 m; cells are 10 m)
    big_ha: 50000                       # larger polygons (the sea: basin-wide, up to 800 000 vertices) are fetched once and kept in _big/
    chunk: 300                          # polygons per request
    citation: "Copernicus Land Monitoring Service, Coastal Zones Land Cover/Land Use 2018 (vector), European Environment Agency. doi:10.2909/205e2db2-4e35-4b1b-bf84-271c4a82248c"
    classes:                            # code: [label (the product's, shortened), the product's legend colour (the map service's renderer)]
      11110: ["continuous urban fabric", "#d20000"]
      11120: ["dense urban fabric", "#f20000"]
      11130: ["low density urban fabric", "#f5a18a"]
      11210: ["industrial, commercial and public units", "#9862f0"]
      11220: ["nuclear energy plants", "#8748ee"]
      12100: ["road networks", "#838b9d"]
      12200: ["railways", "#404040"]
      12310: ["cargo port", "#ffe6de"]
      12320: ["passenger port", "#f0d7de"]
      12330: ["fishing port", "#e1c8de"]
      12340: ["naval port", "#d2b9de"]
      12350: ["marinas", "#c3aade"]
      12360: ["local multi-functional harbours", "#b49bde"]
      12370: ["shipyards", "#a181d5"]
      12400: ["airports", "#e19fc2"]
      13110: ["mineral extraction sites", "#966401"]
      13120: ["dump sites", "#875501"]
      13130: ["construction sites", "#784601"]
      13200: ["land without current use", "#693701"]
      14000: ["green urban, sports and leisure", "#91d700"]
      21100: ["arable land", "#ffffa8"]
      21200: ["greenhouses", "#b9c151"]
      22100: ["vineyards, fruit trees and berries", "#f3830b"]
      22200: ["olive groves", "#df9f00"]
      23100: ["annual crops with permanent crops", "#ffe6a6"]
      23200: ["complex cultivation patterns", "#ffe64d"]
      23300: ["agriculture with natural vegetation", "#e6cc4d"]
      23400: ["agro-forestry", "#edc69f"]
      31100: ["broadleaved forest", "#82be00"]
      31200: ["broadleaved plantations", "#82be00"]
      32100: ["coniferous forest", "#027800"]
      32200: ["coniferous plantations", "#027800"]
      33100: ["mixed forest", "#41a000"]
      33200: ["mixed plantations", "#41a000"]
      34000: ["transitional woodland and scrub", "#a9f100"]
      35000: ["lines of trees and scrub", "#c3f200"]
      36000: ["damaged forest", "#2b342b"]
      41000: ["managed grassland", "#e6e64d"]
      42100: ["semi-natural grassland", "#e0f24d"]
      42200: ["alpine and sub-alpine grassland", "#ccf24d"]
      51000: ["heathland and moorland", "#a6ff80"]
      52000: ["alpine scrub land", "#a0ef6a"]
      53000: ["sclerophyllous scrubs", "#a9ec5c"]
      61100: ["sparse vegetation on sands", "#ccffd7"]
      61200: ["sparse vegetation on rocks", "#c8f0c8"]
      62111: ["sandy beaches", "#e0f5dc"]
      62112: ["shingle beaches", "#e0ebdc"]
      62120: ["dunes", "#f0f5dc"]
      62200: ["river banks", "#e0e1dc"]
      63110: ["bare rocks and outcrops", "#b4beb4"]
      63120: ["coastal cliffs", "#b4b4aa"]
      63200: ["burnt areas", "#a0aaa0"]
      63300: ["glaciers and perpetual snow", "#8c968c"]
      71100: ["inland marshes", "#a6a6fd"]
      71210: ["exploited peat bogs", "#5d60f9"]
      71220: ["unexploited peat bogs", "#464af8"]
      72100: ["salt marshes", "#91c8f0"]
      72200: ["salines", "#858fa7"]
      72300: ["intertidal flats", "#a2a3e3"]
      81100: ["water courses", "#00f1dd"]
      81200: ["canals and modified water courses", "#00f4cf"]
      81300: ["oxbows", "#79ecf0"]
      82100: ["natural lakes", "#82f0f0"]
      82200: ["reservoirs", "#78e6e6"]
      82300: ["aquaculture ponds", "#6edcdc"]
      82400: ["water bodies of extraction sites", "#64d2d2"]
      83100: ["lagoons", "#00ffa6"]
      83200: ["estuaries", "#00f096"]
      83300: ["marine inlets and fjords", "#00e187"]
      84100: ["open sea", "#e6f5f3"]
      84200: ["coastal waters", "#d2e6eb"]
    sea_classes: [83100, 83200, 83300, 84100, 84200]   # the sea of the block; on its land (the DEM's, whose coastline
    shore_fill_m: 50                    # differs by a cell or two) such a cell takes the nearest other class within this distance
    soften: [0.8, 0.97]                 # HSV saturation / value factors for the 2D strip
    soften_3d: [0.55, 0.92]             # ... and under the path tracer, as for WorldCover

grid:
  crs: auto                             # the path's UTM zone (EPSG:326xx); the Athens figures were first made in EPSG:2100
  cell_m: 10
  max_cells: 6000000                    # above this the cell is coarsened (forge3d holds about 7 M cells)
  dem_resampling: bilinear             # GLO-30 (30 m) -> grid
  bathy_resampling: cubic               # EMODnet (115 m) -> grid; nodata-aware, so land does not bleed in
  margin_m: {north: 2500, south: 1500, east: 1500, west: 1500}   # around the path's bounding box; a single number works too
  land_threshold_m: 0.5                 # DEM above this = land (GLO-30 has the sea at 0)
  sea_floor_cap_m: -0.5                 # sea cells never rise above this
  min_land_component_cells: 8           # drop DEM speckle at sea
  landcover_as_land: true               # WorldCover classes other than water count as land too (polders, flats under the threshold)
  seam_cells: 6                         # ramp the sea floor from the cap to EMODnet over this many cells off the shoreline
  bathy_smooth_sigma_m: 40              # Gaussian on the sea floor (metres): the 115 m source cells would read as terraces
  land_smooth_sigma_cells: 0            # optional Gaussian on land (GLO-30 is a surface model: buildings, trees)

profile:
  step_m: 5                             # sampling step along the path
  land_extension_m: 50                  # the path continues this far beyond the inland-most sample
  nominal_shore_distance_m: {shoreline: 0, coastal: 30, transition: 100, inland: 250, terrestrial: 3000}   # for samples without shore_distance
  sea_extension_m: 2000                 # without a Tara station the path continues this far offshore along the transect bearing
  route_around_land: true               # a marine leg that crosses land follows the shortest sea route instead (Dijkstra on the land mask)
  route: {cell_m: 50, land_buffer_m: 100, snap_m: 1500, max_detour: 5}   # routing grid, distance kept from land, endpoint snap, give-up ratio
  break_at_m: 1500                      # broken x axis: metres up to here, kilometres beyond
  end_padding_frac: 0.04                # room after the last station (or the offshore end), as a fraction of the last panel
  coastal_zones_strip_frac: 0.035       # the Coastal Zones strip at the foot of every panel, as a fraction of its height (0 = none)
  zones:                                # TREC sampling contexts, metres from the shoreline (negative = inland)
    - {name: "inland\n200-300 m", from: -300, to: -200}
    - {name: "transition\n50-150 m", from: -150, to: -50}
    - {name: "coastal\n10-50 m", from: -50, to: -10}
    - {name: "shoreline", from: -10, to: 10}
    - {name: "coastal waters", from: 10, to: 1000}
    - {name: "offshore (> 1 km)", from: 1000, to: null}
  figure: {width_in: 12.5, height_in: 5.0, dpi: 300}
  land_zoom: {enabled: true, from_m: -320, to_m: 120}   # the first panel: the land transect on its own vertical scale (widened to the inland-most sample)
  colors:
    land: "#d8cdb0"
    ground_line: "#6b5e48"
    sea_floor: "#a98b68"                # the ground under the sea floor: brown, so the section does not read as all water
    water: "#cfe6ee"
    sea_level: "#2f6fa3"
    zone: "#8a5a2b"
    station: "#c8102e"
    sample: "#20262e"

schematic:                              # the TREC sampling-concept figure drawn with real data
  linthresh_m: 20                       # symmetric-log distance axis: linear within +-20 m of the shoreline
  linscale: 0.35
  ribbon_pt: 5                          # land cover ribbon along the surface, in points
  tube_pt: 11                           # sample tube markers, in points
  end_padding_frac: 0.05                # room after the last station, as a fraction of the (symlog) axis width
  coastal_zones_band: 0.14              # the Coastal Zones band under the section, as a height ratio (the zone band is 0.14; 0 = none)
  figure: {width_in: 12.5, height_in: 6.4, dpi: 300}
  zones:
    - {name: "Inland", from: null, to: -50, color: "#b9d59a"}
    - {name: "Coastal transition zone", from: -50, to: 1000, color: "#ead9a6"}
    - {name: "Offshore", from: 1000, to: null, color: "#a9c9e3"}
  colors:
    land: "#d8cdb0"
    ground_line: "#6b5e48"
    sea_floor: "#a98b68"
    water: "#cfe6ee"
    sea_level: "#2f6fa3"
    soil: "#6f9a3a"
    sediment: "#c98b3a"
    tube_edge: "#3b3b3b"
    water_sample: "#bfe0ee"
    water_sample_edge: "#2f6fa3"
    cast_line: "#2f6fa3"
    boat: "#20262e"
    text: "#20262e"

render:
  exaggeration: 3.0                     # vertical exaggeration on top of true metres (land)
  sea_exaggeration_factor: 2.0          # depths get exaggeration x this factor, so the sea floor reads as relief; stated in the legend
  max_block_height_frac: 0.25           # the exaggerations shrink when the block would be taller than this x the plate's shorter side
  block:
    pad_cells: 2                        # rim around the grid: one ring at the edge heights, then the base; renders the cut walls
    base_depth_m: null                  # base of the block; null = 25 m below the deepest cell, rounded to 50 m
    cut_face_color: "#7d6450"           # the walls: brown ground (no other albedo comes within 0.005 of it, the wall mask relies on that)
    waterline_color: "#2f6fa3"          # sea level drawn along the walls
    axis: {step_land_m: 100, step_sea_m: 50, max_ticks: 8, color: "#20262e"}   # the vertical axis at the front-left corner; steps coarsen above max_ticks
  water:                                # post-processed sea: depth attenuation plus a wavy, semi-transparent surface at sea level
    enabled: true
    color_stops: [[0, "#7fe0df"], [5, "#4cc6cd"], [15, "#2aa5bd"], [40, "#1d7aa8"], [90, "#15508c"], [160, "#0e3468"], [260, "#09244c"]]   # water body by depth: turquoise to deep blue
    depth_scale_m: 8                    # metres below sea level for 63% of max_alpha: shallow sandy bays read turquoise, not beige
    max_alpha: 0.85                     # leaves a little of the lit floor relief visible at depth
    surface:
      sky_color: "#c9dff0"              # what the surface reflects: a pale blue
      base_alpha: 0.15                  # veil of the surface itself, on top of the Fresnel term
      fresnel_f0: 0.02
      wave_shading: 1.4                 # gain on the wave tilt towards the sun (the visible ripples); keep low for a smooth sea
      crest: 1.8                        # shading above this gets white added (wave crests); out of reach = no foam
      crest_white: 0.0
      refraction_gain: 60               # pixels of floor displacement per unit wave slope, at 3840 wide
      waves: [[520, 0.030, 200], [300, 0.025, 215], [170, 0.018, 185], [90, 0.010, 240]]   # [wavelength m, slope, from-bearing]: long, gentle swells
      ripple: {scale_m: 160, slope: 0.012, smooth: 4}
      wave_scale: 1.0                   # wavelengths x this (the nearshore zoom uses 0.3)
      seed: 3
  tile_px: 960                          # the grid plus one tile must stay under forge3d's 512 MiB budget
  earth_model: flat                     # the plate is ~15 km wide: no Earth curvature
  refraction_model: none                # required together with earth_model: flat
  albedo_sampling: bilinear
  camera:                               # a low view from the sea: the block reads as a section, not a map
    azimuth_deg: auto                   # compass bearing the camera sits at: auto = the transect's seaward bearing, or a number
    azimuth_snap_deg: 90                # auto azimuths snap to a plate edge (0, 90, 180, 270), so the front wall is a cut face
    elevation_deg: 20
    fov_y_deg: 21
    fill: 0.84                          # fraction of the frame width the near plate edge spans (room for the axis and legend)
    fill_vertical: 0.55                 # the plate's depth plus the block's height fit this fraction of the frame height
    target_lift_m: 0
    target_shift_north_frac: -0.10      # look-at towards the camera: lifts the block in the frame, clear of the legend row
    target_shift_east_frac: 0.0
    max_bottom_frac: 0.74               # the block's base stays above this fraction of the frame height (the legend row below)
    min_top_frac: 0.17                  # ... without its top rising above this one (the title, credits and key); else the camera steps back
  sun: {azimuth_deg: auto, offset_from_camera_deg: -55, elevation_deg: 35, intensity: 12}   # auto = camera azimuth + offset (180 -> 125)
  side_overrides:                       # merged over this section when `--view side` turns the camera (transect left to right)
    camera: {elevation_deg: 24, fill_vertical: 0.6, target_shift_north_frac: -0.13}
  env_intensity: 1.7
  turbidity: 1.4
  seed: 11
  quality:
    preview: {size: [1600, 900], frames: 6}
    draft: {size: [2560, 1440], frames: 16}
    final: {size: [3840, 2160], frames: 64}
  albedo:                               # sRGB stops [height_m, colour], interpolated per channel, then linearised
    land_mode: coastal_zones            # coastal_zones (Copernicus Coastal Zones 2018; WorldCover where a transect has none), landcover (ESA WorldCover) or hypsometric (the `land` ramp)
    legend_max_classes: 12              # the legend lists the largest classes on land (those over 1%)
    land: [[0, "#dcd2b6"], [10, "#cfc49e"], [50, "#b9b78b"], [150, "#a3a67a"], [400, "#8f8a6a"]]
    sea: [[0, "#b08a62"], [-5, "#9a7452"], [-20, "#7d5c40"], [-60, "#64482f"], [-120, "#4e3724"], [-250, "#3a281a"]]   # sea floor: sand to dark brown, seen through the water
    shoreline: {color: "#f6efdc", width_cells: 1}
  page:
    background: "#f7f4ee"
    text: "#20262e"
    muted: "#5d6670"
    accent: "#8a5a2b"
    path: "#c8102e"
    station: "#c8102e"
    sample: "#20262e"
    vignette: 0.12
