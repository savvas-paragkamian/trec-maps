# Transects are defined by TREC site IDs only; coordinates are read from the data
# exports at run time (data/*.xlsx), so this file holds nothing that is not public.
#
#   land_site     the LSI land transect (soil / sediment samples with shore distances)
#   marine_sites  Tara stations in the order the profile path visits them after the shoreline
#   waypoints     optional [lon, lat] points inserted after a site to keep a marine leg off the beach
#   land_path     from_samples (shoreline event -> inland event) or explicit [[lon, lat], [lon, lat]]
#   grid / profile / render   optional overrides of the same sections of params.yml (merged key by key)
#
# Every LSI site of the samples export that no entry below covers becomes a transect named after
# its alias (Roscoff_LSI_1 -> roscoff_lsi_1): `python scripts/_common.py` (make list) prints them all.
auto:
  enabled: true
  max_station_km: 20                  # the site's related Tara stations within this distance, nearest first
  max_stations: 2
  max_unrelated_km: 10                # a site without a related station that close takes the nearest station within this distance
  overrides:                          # merged over a generated transect (same keys as an explicit entry)
    # the sea route to the station leaves the default box (a peninsula, a bay mouth): wider margins
    aarhus_lsi_1:       {grid: {margin_m: 5000}}
    asko_lsi_2:         {grid: {margin_m: 5000}}
    asko_lsi_3:         {grid: {margin_m: 5000}}
    baie_de_veys_lsi_1: {grid: {margin_m: 5000}}
    banyuls_lsi_2:      {grid: {margin_m: 5000}}
    bilbao_lsi_2:       {grid: {margin_m: 5000}}
    faro_lsi_3:         {grid: {margin_m: 5000}}
    ferrol_lsi_1:       {grid: {margin_m: 5000}}
    galway_lsi_4:       {grid: {margin_m: 5000}}
    helsingor_lsi_1:    {grid: {margin_m: 5000}}
    kotor_lsi_1:        {grid: {margin_m: 5000}}
    thrace_lsi_4:       {grid: {margin_m: 5000}}
    tallinn_lsi_1:      {grid: {margin_m: 5000}}   # the route round the Kopli peninsula followed the box edge
transects:
  anavyssos:
    title: "Anavyssos"
    subtitle: "TREC land-sea transect 041-03 (HCMR supersite) with Tara stations TE_176 and TE_177"
    land_site: "041-03"
    marine_sites: ["041-11", "041-12"]
    waypoints:                          # the TE_176 -> TE_177 leg would cross the HCMR cape and the cape west of it
      - after: "041-11"
        points: [[23.9240, 37.7105], [23.8980, 37.7025]]
    land_path: from_samples
  anavyssos_nearshore:
    title: "Anavyssos, the land-sea interface"
    subtitle: "TREC soil transect 041-03 (HCMR supersite) and Tara station TE_176, 1.2 km offshore"
    land_site: "041-03"
    marine_sites: ["041-11"]
    waypoints: []
    land_path: from_samples
    grid: {cell_m: 5, margin_m: {north: 700, south: 700, east: 500, west: 700}}
    profile: {break_at_m: 400}
    render:
      exaggeration: 3
      camera: {azimuth_deg: 175, elevation_deg: 22, fill: 0.66, target_shift_north_frac: -0.06}
      water: {depth_scale_m: 6, surface: {wave_scale: 0.3, refraction_gain: 100}}   # a bay under 10 m deep, 2.4 km wide
  psatha:
    title: "Psatha"
    subtitle: "TREC land-sea transect 041-01 (Gulf of Corinth) with Tara station TE_172"
    land_site: "041-01"
    marine_sites: ["041-07"]
    waypoints: []
    land_path: from_samples
    render: {exaggeration: 1.5, camera: {azimuth_deg: 295, elevation_deg: 28, fill: 0.7}}   # a bay walled by 576 m peaks: diagonal view from the NW, less exaggeration
  salamina:
    title: "Salamina"
    subtitle: "TREC land-sea transect 041-02 (Saronic Gulf) with Tara station TE_173"
    land_site: "041-02"
    marine_sites: ["041-08"]
    waypoints: []
    land_path: from_samples
  thoriko:
    title: "Thoriko"
    subtitle: "TREC land-sea transect 041-04 (Thoriko marina) with Tara station TE_178"
    land_site: "041-04"
    marine_sites: ["041-13"]
    waypoints:                          # the leg to TE_178 would cross the headland east of the marina
      - after: "shoreline"
        points: [[24.07092, 37.73163]]
    land_path: from_samples
  schinias:
    title: "Schinias"
    subtitle: "TREC land-sea transect 041-05 (Schinias beach, Marathon); no Tara station nearby, the profile continues 2 km offshore"
    land_site: "041-05"
    marine_sites: []
    waypoints: []
    land_path: from_samples
